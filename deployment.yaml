apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student
  template:
    metadata:
      labels:
        app: student
    spec:
      containers:
        - name: student-container
          image: student-management:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080